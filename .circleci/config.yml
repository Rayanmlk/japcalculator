version: 2.1
jobs:
  build-test:
    docker:
      # specify the version you desire here
      - image: cimg/node:22.12

    steps:
      - checkout

      # Download and cache dependencies
      - restore_cache:
          keys:
          - v1-dependencies-{{ checksum "package.json" }}
          # fallback to using the latest cache if no exact match is found
          - v1-dependencies-

      - run: npm install

      - save_cache:
          paths:
            - node_modules
          key: v1-dependencies-{{ checksum "package.json" }}

      # run tests!
      - run: npm run test
      - run: npm run build

  security-audit:
    docker:
      - image: cimg/node:22.12

    steps:
      - checkout

      # check dependencies for known vulnerabilities
      # (non-blocking for now: "npm audit fix" would break this old project)
      - run: npm audit || true

workflows:
  node-tests:
    jobs:
      - build-test
      - security-audit
